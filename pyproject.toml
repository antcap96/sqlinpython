[project]
name = "sqlinpython"
version = "0.1.0"
description = ""
authors = [
    { name = "António Capela", email = "acapela96@hotmail.com" }
]
requires-python = ">=3.12"

dependencies = ["typing_extensions"]

[project.optional-dependencies]
dev = [
    "mypy",
    "pyrefly",
    "basedpyright",
    "ruff",
    "ty",
    "ipykernel",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
lint.select = ["E", "F", "I", "UP"]
# UP046: would rewrite Generic[T_co] bases to PEP 695 type params, but PEP 695
# syntax cannot declare explicit variance — which SelectStatement_ needs so
# pyrefly's strict preset accepts SelectStatement_[Core] as SelectStatement_[Complete].
lint.ignore = ["E501", "UP046"]
lint.per-file-ignores = {"src/sqlinpython/__init__.py" = ["F403"]}
fix = true

[tool.mypy]
strict = true
disable_error_code = "type-abstract"
allow_redefinition = true

[tool.ty.analysis]
# Disable support for `type: ignore` comments
respect-type-ignore-comments = false

[tool.basedpyright]
reportUnsafeMultipleInheritance = false
reportMissingSuperCall = false
reportUnannotatedClassAttribute = false
reportPrivateUsage = false
# Import cycles between column_definition, foreign_key_clause, and table_constraint
# are architectural - these classes are genuinely interdependent and work fine at runtime.
reportImportCycles = false
reportUnnecessaryTypeIgnoreComment = true

[tool.pyrefly]
preset = "strict"
